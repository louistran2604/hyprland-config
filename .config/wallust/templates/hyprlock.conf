# Generated by Wallust; edit ~/.config/wallust/templates/hyprlock.conf instead.
# Layout: macOS-inspired clock with Waybar's glass surfaces and font.

general {
    hide_cursor = true
}

background {
    monitor =
    path = {{wallpaper}}
    color = rgb({{background | strip}})
    blur_passes = 3
    blur_size = 5
    brightness = 0.78
    contrast = 1.0
    vibrancy = 0.12
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    color = rgba({{foreground | strip}}dd)
    font_size = 18
    font_family = Roboto Mono for Powerline
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = <span weight="bold">$TIME</span>
    color = rgb({{foreground | strip}})
    font_size = 96
    font_family = Roboto Mono for Powerline
    position = 0, 55
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb({{color7 | strip}})
    font_size = 16
    font_family = Roboto Mono for Powerline
    position = 0, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    position = 0, -110
    halign = center
    valign = center
    rounding = -1
    outline_thickness = 1
    outer_color = rgba({{color12 | strip}}88) rgba({{color7 | strip}}33) 45deg
    inner_color = rgba({{background | strip}}55)
    font_color = rgb({{foreground | strip}})
    font_family = Roboto Mono for Powerline
    placeholder_text = Password
    fail_text = Incorrect password
    check_color = rgb({{color12 | strip}})
    fail_color = rgb({{color13 | strip}})
    swap_font_color = false
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = false
}
