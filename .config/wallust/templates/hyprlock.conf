# Generated by Wallust; edit ~/.config/wallust/templates/hyprlock.conf instead.
# Layout: macOS-inspired clock with Waybar's glass surfaces and font.
# clock-colors = {{color12}} {{foreground}}

general {
    hide_cursor = true
}

background {
    monitor =
    path = {{wallpaper}}
    color = rgb({{background | strip}})
    blur_passes = 3
    blur_size = 5
    brightness = 0.68
    contrast = 1.0
    vibrancy = 0.12
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    color = rgba({{foreground | strip}}dd)
    font_size = 18
    font_family = Roboto Mono for Powerline
    position = 0, 170
    halign = center
    valign = center
}

image {
    monitor =
    path = $HOME/.cache/hyprlock/clock.png
    size = 148
    rounding = 0
    border_size = 0
    position = 0, 70
    halign = center
    valign = center
    # Check the minute promptly; the helper reuses the image until it changes.
    reload_time = 1
    reload_cmd = python3 $HOME/.config/hypr/scripts/HyprlockClock.py
}

label {
    monitor =
    text = <span font_family="JetBrainsMono Nerd Font"></span> $USER <span font_family="JetBrainsMono Nerd Font" alpha="1"></span>
    color = rgb({{color7 | strip}})
    font_size = 16
    font_family = Roboto Mono for Powerline
    position = 0, -75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    position = 0, -130
    halign = center
    valign = center
    rounding = -1
    outline_thickness = 1
    outer_color = rgba({{color12 | strip}}88) rgba({{color7 | strip}}33) 45deg
    inner_color = rgba({{background | strip}}55)
    font_color = rgb({{foreground | strip}})
    font_family = Roboto Mono for Powerline
    placeholder_text = Password
    fail_text = Incorrect password
    check_color = rgb({{color12 | strip}})
    fail_color = rgb(ff5f57)
    swap_font_color = false
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = false
}
