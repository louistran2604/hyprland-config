# Warn - idle detection
# NOTE: Removed notify-send from on-timeout and on-resume to fix duplicate notifications.
# SwayNC has its own idle detection that handles "you are idle" / "welcome back" messages.
# Keeping both caused duplicate notifications. If you want hypridle to handle notifications
# instead of SwayNC, uncomment the notify-send lines and add notification-visibility rules
# in swaync's config.json to suppress swaync's idle messages.
listener {
    timeout = 540                     # 9 min
    on-timeout = echo "Idle detected" # replaced: notify-send -i $iDIR " You are idle!"
    on-resume = echo "Resumed from idle"  # replaced: notify-send -i $iDIR " Oh! you're Back" " Hello !!!"
}

# Screenlock
listener {
    timeout = 600                     # 10 min
    on-timeout = loginctl lock-session # command to run when timeout has passed
    #on-resume = notify-send -i $iDIR " System Unlocked!"  # command to run when activity is detected after timeout has fired.
}

