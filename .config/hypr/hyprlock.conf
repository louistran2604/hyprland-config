# Generated by Wallust; edit ~/.config/wallust/templates/hyprlock.conf instead.
# Layout: macOS-inspired clock with Waybar's glass surfaces and font.
# clock-colors = #96B3C4 #F1ECE8

general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/louistran/Pictures/wallpapers/wallpaper/starship.jpeg
    color = rgb(070000)
    blur_passes = 3
    blur_size = 5
    brightness = 0.68
    contrast = 1.0
    vibrancy = 0.12
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    color = rgba(F1ECE8dd)
    font_size = 18
    font_family = Roboto Mono for Powerline
    position = 0, 170
    halign = center
    valign = center
}

image {
    monitor =
    path = $HOME/.cache/hyprlock/clock.png
    size = 149
    rounding = 0
    border_size = 0
    position = 0, 70
    halign = center
    valign = center
    # Check the minute promptly; the helper reuses the image until it changes.
    reload_time = 1
    reload_cmd = python3 $HOME/.config/hypr/scripts/HyprlockClock.py
}

label {
    monitor =
    text = $USER
    color = rgb(E3DCD6)
    font_size = 16
    font_family = Roboto Mono for Powerline
    position = 0, -75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    position = 0, -130
    halign = center
    valign = center
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(96B3C488) rgba(E3DCD633) 45deg
    inner_color = rgba(07000055)
    font_color = rgb(F1ECE8)
    font_family = Roboto Mono for Powerline
    placeholder_text = Password
    fail_text = Incorrect password
    check_color = rgb(96B3C4)
    fail_color = rgb(D8CABE)
    swap_font_color = false
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = false
}
